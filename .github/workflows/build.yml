name: Build Project

on:
  push:
    branches:
      - stable
      - dev
  pull_request:
    branches:
      - stable
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEVELOPMENT: ${{ github.ref_name == 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Grant permissions
        run: chmod +x ./gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew build

      - name: Prepare artifact name
        id: artifact_name
        run: |
          REF_NAME="${{ github.head_ref || github.ref_name }}"
          SAFE_REF_NAME="${REF_NAME//\//-}"
          echo "name=ruppim-$SAFE_REF_NAME" >> $GITHUB_OUTPUT
          echo "safe=$SAFE_REF_NAME" >> $GITHUB_OUTPUT

      - name: Collect jar
        run: |
          mkdir -p out
          # Только готовый .jar (без -sources, -javadoc, -plain)
          find . -path "./out" -prune -o -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "*-plain.jar" \
            -print -exec cp {} out/ \;
          ls -lh out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: out/*.jar

      - name: Publish to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ steps.artifact_name.outputs.safe }}"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" out/*.jar \
            --target "${{ github.sha }}" \
            --title "Build (${{ steps.artifact_name.outputs.safe }})" \
            --notes "Автосборка из коммита ${{ github.sha }}. Внутри только .jar."